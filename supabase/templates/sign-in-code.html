<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#F3F5F4;font-family:Inter,Arial,sans-serif;color:#14201B">
    <div style="max-width:480px;margin:0 auto;padding:28px;border-radius:16px;background:#FFFFFF">
      <h1 style="margin:0 0 12px;font-size:22px">Your sign-in code</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#55635D">Enter this code in Auto Budget to sign in. It expires in 10 minutes.</p>
      <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#55635D">If you didn't ask for this code, you can ignore this email. Nobody can sign in without it.</p>
    </div>
  </body>
</html>
